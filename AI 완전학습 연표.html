<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI 완전학습 연표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 간트식 작업대 — 왼쪽 분야(트랙) 열, 오른쪽 연도축, 상단 학습 진도, 하단 전체 연표 슬라이더 */
:root{
  --bg:#eceef3;
  --surface:#fbfbfd;
  --sunk:#f0f1f6;
  --ink:#171c2b;
  --muted:#5d6478;
  --line:#d5d9e3;
  --grid:rgba(23,28,43,.07);
  --accent:#3a46a8;
  --accent-ink:#ffffff;
  --now:#c8553d;
  --ok:#2f8a5b;
  --danger:#b03a2e;
  --shadow:0 10px 30px rgba(20,24,45,.14);
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --lw:164px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1018; --surface:#151826; --sunk:#1b1f30; --ink:#e6e8f0; --muted:#949ab0; --line:#2a2f45;
  --grid:rgba(230,232,240,.06); --accent:#8f9bff; --accent-ink:#0e1018; --now:#ee8a6f; --ok:#5fc48c; --danger:#ee8a6f;
  --shadow:0 12px 34px rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1018; --surface:#151826; --sunk:#1b1f30; --ink:#e6e8f0; --muted:#949ab0; --line:#2a2f45;
  --grid:rgba(230,232,240,.06); --accent:#8f9bff; --accent-ink:#0e1018; --now:#ee8a6f; --ok:#5fc48c; --danger:#ee8a6f;
  --shadow:0 12px 34px rgba(0,0,0,.55); color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-direction:column;gap:10px}
.headrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 300px}
.mark{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:20px;font-weight:500;border-radius:7px}
#title{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);font-weight:800;letter-spacing:-.01em;padding:2px 4px;border-radius:6px}
#title:hover{background:var(--sunk)}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex:0 1 380px;min-width:0}
.prog b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{flex:1;min-width:60px;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
#pg-pct{font-family:var(--f-mono);color:var(--ok);font-weight:500;min-width:3.2em;text-align:right}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.grp>button{border:0;background:transparent;padding:7px 11px;white-space:nowrap;font-size:13px;font-weight:600}
.grp>button+button{border-left:1px solid var(--line)}
.grp>button:hover:not(:disabled){background:var(--sunk)}
.grp>button.pri{background:var(--accent);color:var(--accent-ink)}
.grp>button.pri:hover{filter:brightness(1.08);background:var(--accent)}
.grp>button:disabled{opacity:.35}
.grp>button.warn{color:var(--danger)}
.grp>button.on{background:var(--ok);color:#fff}
.zoomgrp{padding-right:4px}
#zoom{width:100px;accent-color:var(--accent);margin:0 6px}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 4px 0 10px}
.field select{border:0;background:transparent;padding:7px 4px;font-size:13px;color:var(--ink);font-weight:600}
#q{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 10px;width:150px;font-size:13px}

/* board */
.board{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);overscroll-behavior:contain}
.ruler{position:sticky;top:0;z-index:8;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.corner{width:var(--lw);flex:none;box-sizing:border-box;border-right:1px solid var(--line);padding:0 12px;display:flex;align-items:center;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.rtrack{position:relative;flex:1;min-width:0;height:44px;overflow:hidden}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.tick span{position:absolute;top:5px;left:5px;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick.dec span{color:var(--ink);font-weight:500}
.nowtag{position:absolute;top:4px;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;background:var(--now);color:#fff;padding:1px 5px;border-radius:3px;z-index:2}
.bandtag{position:absolute;bottom:4px;height:15px;line-height:15px;font-size:10px;font-weight:700;padding:0 5px;border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box}
.row{display:flex;border-bottom:1px solid var(--line);position:relative}
.row.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.row.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.label{width:var(--lw);flex:none;box-sizing:border-box;border-right:1px solid var(--line);padding:10px 10px 10px 6px;display:flex;gap:7px;align-items:flex-start;cursor:pointer;background:var(--surface);user-select:none}
.label:hover{background:var(--sunk)}
.row.csel .label{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.grip{flex:none;width:10px;height:22px;cursor:grab;touch-action:none;background-image:radial-gradient(circle,var(--muted) 1.2px,transparent 1.4px);background-size:5px 5px;opacity:.55}
.grip:hover{opacity:1}
.chip{flex:none;width:10px;height:10px;border-radius:2px;margin-top:5px}
.ln{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ln b{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln small{font-size:11px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mini-bar{height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--ok)}
.track{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:pan-y;cursor:grab}
.board.panning .track{cursor:grabbing}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid);pointer-events:none}
.band{position:absolute;top:0;bottom:0;opacity:.11;pointer-events:none;background:repeating-linear-gradient(135deg,var(--c) 0 6px,transparent 6px 12px)}
.nowline{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--now);opacity:.6;pointer-events:none;z-index:1}

.bar{position:absolute;height:26px;box-sizing:border-box;border-radius:5px;background:var(--c);display:flex;align-items:center;gap:6px;padding:0 10px;cursor:grab;touch-action:none;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:700;z-index:3;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);user-select:none}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.bar:hover{z-index:5;filter:brightness(1.06)}
.bar .bt{overflow:hidden;text-overflow:ellipsis}
.bar .by{font-family:var(--f-mono);font-size:10.5px;font-weight:500;opacity:.78;font-variant-numeric:tabular-nums}
.bar .ck{font-size:12px}
.bar .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:1}
.bar .h.l{left:0}.bar .h.r{right:0}
.bar .h::after{content:"";position:absolute;top:7px;bottom:7px;left:3px;width:3px;border-left:1px solid currentColor;border-right:1px solid currentColor;opacity:0}
.bar:hover .h::after,.bar.sel .h::after{opacity:.6}
.sel{outline:2px solid var(--ink);outline-offset:2px;z-index:6!important}
.dim{opacity:.16}

.evt{position:absolute;height:20px;display:flex;align-items:center;gap:5px;cursor:grab;touch-action:none;white-space:nowrap;font-size:12px;z-index:2;user-select:none}
.evt::after{content:"";position:absolute;left:4.5px;top:15px;height:var(--stem);border-left:1.5px dashed var(--c);opacity:.45;pointer-events:none}
.evt .dot{flex:none;width:10px;height:10px;box-sizing:border-box;border-radius:50%;background:var(--c);border:1.5px solid var(--surface);box-shadow:0 0 0 1px var(--c)}
.evt .et{font-weight:700;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:4px}
.evt.done .et{border-color:var(--ok)}
.evt.done .et::before{content:"✓ ";color:var(--ok)}
.evt .ey{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.evt:hover{z-index:5}
.evt:hover .et{border-color:var(--c)}
.evt.mini{height:12px}
.evt.mini .dot{width:9px;height:9px}
.evt.mini::after{top:11px}
.evt.sel{outline-offset:3px;border-radius:4px}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* footer + navigator */
.foot{display:flex;flex-direction:column;gap:6px}
.nav{position:relative;height:66px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;touch-action:none;cursor:pointer;user-select:none}
.ntk{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.ntk span{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:9.5px;color:var(--muted);white-space:nowrap}
.np{position:absolute;height:3px;border-radius:2px;opacity:.85}
.ne{position:absolute;width:2px;height:7px}
.nb{position:absolute;top:0;bottom:0;opacity:.14}
.shade{position:absolute;top:0;bottom:0;background:var(--bg);opacity:.55;pointer-events:none}
.brush{position:absolute;top:0;bottom:0;box-sizing:border-box;border:2px solid var(--accent);border-radius:8px;cursor:grab;background:transparent}
.brush:active{cursor:grabbing}
.bh{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize}
.bh.l{left:-7px}.bh.r{right:-7px}
.bh::after{content:"";position:absolute;left:4px;top:50%;width:6px;height:22px;margin-top:-11px;border-radius:3px;background:var(--accent)}
.hint{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.hint kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--surface)}

/* inspector */
#insp{position:fixed;right:24px;top:150px;width:340px;max-height:calc(100% - 178px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30}
.ih{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.ih h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:800;line-height:1.3;text-wrap:balance}
.ih .kind{font-size:11px;letter-spacing:.04em;color:var(--muted);display:block;font-weight:600;margin-bottom:2px}
.x{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--sunk)}
.ib{padding:14px;display:flex;flex-direction:column;gap:12px}
.study{display:flex;gap:8px;align-items:stretch}
.learn{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:700;font-size:13px;text-align:left}
.learn.on{border-color:var(--ok);background:var(--ok);color:#fff}
.stepper{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--bg);padding:0 11px;font-weight:700}
.stepper button+button{border-left:1px solid var(--line)}
.stepper button:hover{background:var(--sunk)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.meta .yrs{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.ib label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.ib input[type=text],.ib input[type=number],.ib select,.ib textarea{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:7px 9px;font-size:14px;color:var(--ink);min-width:0;font-weight:400}
.ib textarea{resize:vertical;min-height:96px;line-height:1.6}
.ib details{border-top:1px solid var(--line);padding-top:10px}
.ib summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.ib details[open] summary{margin-bottom:12px}
.ib details>div{display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px;font-size:13px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.yr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yr2 input{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.sws{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sw{aspect-ratio:1;max-width:100%;border-radius:6px;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.swc{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px dashed var(--muted);display:grid;place-items:center;font-size:15px;color:var(--muted)}
.swc input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.small{font-size:12px;color:var(--muted);margin:0;line-height:1.5}

/* tooltip */
#tip{position:fixed;z-index:40;pointer-events:none;max-width:280px;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;box-shadow:var(--shadow)}
#tip b{display:block;font-size:13px}
#tip .m{font-family:var(--f-mono);font-size:11px;opacity:.8}
#tip .n{margin-top:4px;opacity:.88}

/* modals */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.48);display:grid;place-items:center;padding:16px}
.dlg{width:min(680px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:var(--surface);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dlg h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:800}
.dlg p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.dlg textarea{min-height:260px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;resize:vertical;color:var(--ink)}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mrow .sp{flex:1}
#m-file{font-size:12px;max-width:100%}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* path list */
.pfilters{display:flex;flex-wrap:wrap;gap:8px}
.pfilters select,.pfilters input{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:7px 9px;font-size:13px}
.pfilters input[type=search]{flex:1;min-width:140px}
.plist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:min(56vh,560px)}
.plist li{display:grid;grid-template-columns:24px 52px 1fr;gap:10px;align-items:start;padding:9px 12px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist li.dec{background:var(--sunk);font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);padding:4px 12px;display:block;position:sticky;top:0;z-index:1}
.plist input{accent-color:var(--ok);width:16px;height:16px;margin-top:2px}
.plist .py{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px;font-variant-numeric:tabular-nums}
.plist .pt{display:flex;flex-direction:column;gap:3px;min-width:0}
.plist .pt button{border:0;background:transparent;padding:0;text-align:left;font-weight:700;font-size:14px}
.plist .pt button:hover{color:var(--accent);text-decoration:underline}
.plist .pn{font-size:12px;color:var(--muted);line-height:1.5}
.plist .tr{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.plist .tr i{width:8px;height:8px;border-radius:2px}
.plist li.done .pt button{color:var(--muted);text-decoration:line-through}

/* flashcard */
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.card .ctop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.card .ctop .tr{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.card .ctop .tr i{width:9px;height:9px;border-radius:2px}
.card .cy{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.card .q{font-size:15px;line-height:1.7;margin:0}
.card .mask{display:inline-block;min-width:3em;border-bottom:2px solid var(--muted);color:transparent;user-select:none}
.card .ans{font-family:var(--f-display);font-size:24px;font-weight:800;margin:0;color:var(--accent)}
.card .who{font-size:13px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);box-sizing:border-box}

@media (max-width:760px){
  :root{--lw:100px}
  .app{padding-block:8px;gap:8px}
  .ln small{display:none}
  .grip{display:none}
  .label{padding-left:10px}
  #q{width:100%;order:9}
  #zoom{width:64px}
  .hint{display:none}
  .prog{flex-basis:100%}
  #insp{left:0;right:0;top:auto;bottom:0;width:auto;max-height:64%;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .plist li{grid-template-columns:22px 44px 1fr;gap:8px}
}

const NOW = new Date().getFullYear();
const NOW_F = NOW + (Date.now() - new Date(NOW, 0, 1)) / (365.25 * 864e5), NOW_END = Math.ceil(NOW_F * 10) / 10;
const PAD = 10, STRIP = 16, EVT_H = 24, LANE_H = 34, MIN_ROW = 62, MAXL = 6;

let idc = 0;

const hex = c => (typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c)) ? c.toLowerCase() : null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const items = [];
  const P = (tr, title, s, e, who, tags, note, o = {}) => items.push({ id: uid(), trackId: tr, kind: 'period', title, start: s, end: e, who, tags, note, color: o.c || col[tr], band: !!o.band, learned: false });
  const E = (tr, title, y, who, tags, note, o = {}) => items.push({ id: uid(), trackId: tr, kind: 'event', title, start: y, end: null, who, tags, note, color: o.c || col[tr], band: false, learned: false });

  P('fd','전문가 시스템 붐',1980,1987,'XCON(DEC), 일본 5세대 컴퓨터(1982)','규칙 기반, 지식 공학, 추론 엔진','"IF–THEN" 규칙으로 특정 분야 전문가의 판단을 흉내 낸 시스템. DEC의 XCON이 큰 비용 절감을 거두며 기업 투자가 몰렸습니다.',{ c: '#c9a92e' });
  P('fd','2차 AI 겨울',1987,1993,'LISP 머신 시장 붕괴','지식 획득 병목, 유지보수 비용','전용 LISP 머신 시장이 범용 PC에 밀려 무너지고, 전문가 시스템의 유지보수 비용과 취약성이 드러나 다시 침체기를 맞았습니다. 끝나는 시점은 문헌마다 다릅니다.',{ c: GRAY, band: true });
  P('fd','생성형 AI 대중화',2022,NOW_END,'OpenAI, Anthropic, Google, Meta 등','생성형 AI, 에이전트, 멀티모달','ChatGPT 이후 생성형 AI가 대중 제품으로 퍼진 시기. 이후 도구를 사용하며 여러 단계를 스스로 수행하는 AI 에이전트로 확장되고 있습니다.',{ c: '#7a4fa3' });
  E('fd','튜링 테스트',1950,'앨런 튜링','모방 게임, 기계 지능','논문 「Computing Machinery and Intelligence」에서 "기계는 생각할 수 있는가?"를 대화로 판정하는 모방 게임으로 바꾸어 제안했습니다.');
  E('fd','다트머스 회의',1956,'매카시, 민스키, 섀넌, 로체스터','Artificial Intelligence 용어, AI 학문의 출발','"Artificial Intelligence"라는 이름을 내건 여름 연구 프로젝트(제안서는 1955년). AI가 독립된 학문 분야로 출발한 지점으로 꼽힙니다.');
  E('fd','LISP',1958,'존 매카시','기호 처리, 함수형 언어','리스트와 기호 처리를 위한 언어로, 이후 수십 년간 AI 연구의 표준 언어가 되었습니다.');
  E('fd','딥 블루, 카스파로프 격파',1997,'IBM','게임 트리 탐색, 알파-베타 가지치기','IBM의 체스 컴퓨터가 세계 챔피언 카스파로프에게 6번기 승리. 학습보다는 대규모 탐색과 전용 하드웨어의 승리였습니다.');
  E('fd','왓슨, 제퍼디! 우승',2011,'IBM','질의응답, 정보 검색','퀴즈 쇼 제퍼디!에서 인간 챔피언들을 이겨 자연어 질의응답 기술의 가능성을 보였습니다.');
  E('fd','알파폴드 2',2020,'딥마인드','단백질 구조 예측, AI for Science','단백질 구조 예측 대회 CASP14에서 실험 수준에 가까운 정확도를 보여 50년 난제를 크게 진전시켰습니다.');
  E('fd','AI 연구 노벨상',2024,'홉필드·힌턴(물리), 허사비스·점퍼·베이커(화학)','인공신경망, 단백질 구조','물리학상은 인공신경망 기초를 세운 홉필드와 힌턴, 화학상은 단백질 설계·구조 예측의 베이커, 허사비스, 점퍼에게 돌아갔습니다.');
  E('fd','EU AI Act 발효',2024,'유럽연합','위험 기반 규제, AI 거버넌스','AI 시스템을 위험 수준별로 나누어 규제하는 세계 첫 포괄적 AI 법. 2024년 발효 후 단계적으로 적용됩니다.');

  // 머신러닝
  P('ml','통계적 머신러닝 시대',1990,2012,'바프닉, 브라이먼, 펄 등','커널 방법, 그래픽 모델, 앙상블','규칙을 사람이 쓰는 대신 데이터에서 확률·통계 모델을 학습하는 방식이 주류가 된 시기. 특징(feature)은 여전히 사람이 설계했습니다.');

  E('ml','k-최근접 이웃 이론',1967,'커버 & 하트','k-NN, 비모수 분류, 거리 기반','가장 가까운 이웃의 레이블로 분류하는 규칙의 오류율 상한을 증명해 이론적 기반을 놓았습니다(아이디어는 1951년 Fix & Hodges).');

        <div class="yr2"><label class="f">${it.kind === 'period' ? '시작 연도' : '연도'}<input id="f-start" type="number" step="1" value="${it.start}"></label>${it.kind === 'period' ? `<label class="f">끝 연도<input id="f-end" type="number" step="1" value="${it.end}"></label>` : '<span></span>'}</div>
        <label class="f">인물·기관<input id="f-who" type="text" value="${esc(it.who)}" placeholder="예: 힌턴, 구글"></label>
        <label class="f">핵심 키워드 (쉼표로 구분)<input id="f-tags" type="text" value="${esc(it.tags)}" placeholder="예: 역전파, 은닉층"></label>
        <label class="f">설명<textarea id="f-note" rows="5" placeholder="이 개념이 무엇이고 왜 중요한지">${esc(it.note)}</textarea></label>
        <div class="f"><span class="small">색상</span>${swatches(it.color)}</div>
        ${it.kind === 'period' ? `<label class="chk"><input id="f-band" type="checkbox"${it.band ? ' checked' : ''}> 모든 분야에 시대 배경(빗금)으로 표시</label>` : ''}
        <div class="acts"><button class="btn" data-act="focus">연표에서 보기</button><button class="btn" data-act="dup">복제</button><button class="btn danger" data-act="del">삭제</button></div>
      </div></details>
    </div>`;
  } else {
    const c = x, its = S.items.filter(e => e.trackId === c.id), n = its.length, dn = its.filter(i => i.learned).length, i = S.tracks.indexOf(c);
    insp.innerHTML = `<div class="ih"><h2><span class="kind">분야 편집 · 학습 ${dn}/${n}</span><span id="ih-t">${esc(c.name)}</span></h2><button class="x" data-act="close" aria-label="닫기">×</button></div>
    <div class="ib">
      <label class="f">이름<input id="c-name" type="text" value="${esc(c.name)}"></label>
      <div class="f"><span class="small">대표 색상 · 새 항목의 기본 색</span>${swatches(c.color)}</div>
      <div class="acts"><button class="btn" data-act="up"${i === 0 ? ' disabled' : ''}>↑ 위로</button><button class="btn" data-act="down"${i === S.tracks.length - 1 ? ' disabled' : ''}>↓ 아래로</button><button class="btn" data-act="tpath">이 분야 학습 경로</button></div>
      <div class="acts"><button class="btn pri" data-act="add-p">+ 이 분야에 기간</button><button class="btn" data-act="add-e">+ 개념·사건</button></div>
      <div class="acts"><button class="btn ok" data-act="all-learn">모두 학습 완료</button><button class="btn" data-act="all-reset">학습 표시 초기화</button></div>
      <p class="small">분야를 삭제하면 그 안의 항목 ${n}개도 함께 지워집니다.</p>
      <div class="acts"><button class="btn danger" data-act="cdel">분야 삭제</button><button class="btn" data-act="recolor">모든 항목을 대표 색으로</button></div>
    </div>`;
  }
  insp.hidden = false;
}
function refreshInspectorValues() {
  if (!sel || sel.type !== 'item') return; const it = item(sel.id); if (!it) return;
  const set = (id, v) => { const el = $('#' + id); if (el && document.activeElement !== el) el.value = v; };
  set('f-start', it.start); if (it.kind === 'period') set('f-end', it.end);
  set('f-track', it.trackId);
  const y = $('#m-yrs'); if (y) y.textContent = rangeOf(it);
  const d = $('#m-dur'); if (d) d.textContent = durOf(it);
}
insp.addEventListener('focusin', () => { editCk = false; });
function onField(e) {
  const id = e.target.id; if (!id || !sel) return;
  const x = findSel(); if (!x) return;
  if (!editCk) { checkpoint(); editCk = true; }
  if (sel.type === 'item') {
    const it = x;
    if (id === 'f-title') { it.title = e.target.value; $('#ih-t').textContent = it.title; }
    else if (id === 'f-track') it.trackId = e.target.value;
    else if (id === 'f-start') { const v = Math.round(+e.target.value); if (Number.isFinite(v) && e.target.value !== '') { it.start = v; if (it.kind === 'period' && e.type === 'change' && it.end <= it.start) it.end = it.start + 1; } }
    else if (id === 'f-end') { const v = Math.round(+e.target.value); if (Number.isFinite(v) && e.target.value !== '') { it.end = v; if (e.type === 'change' && it.end <= it.start) { const s = it.start; it.start = Math.min(s, it.end); it.end = Math.max(s, it.end); if (it.end === it.start) it.end++; } } }
    else if (id === 'f-who') it.who = e.target.value;
    else if (id === 'f-tags') it.tags = e.target.value;
    else if (id === 'f-note') it.note = e.target.value;
    else if (id === 'f-band') it.band = e.target.checked;
    else if (id === 'f-color') { it.color = e.target.value; insp.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === it.color)); }
    if (e.type === 'change') refreshInspectorValues();
    const y = $('#m-yrs'); if (y) y.textContent = rangeOf(it);
  } else {
    if (id === 'c-name') { x.name = e.target.value; $('#ih-t').textContent = x.name; }
    else if (id === 'f-color') { x.color = e.target.value; insp.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === x.color)); }
  }
  save(); requestRender();
}
insp.addEventListener('input', onField);
insp.addEventListener('change', onField);
let armT = 0;
insp.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !sel) return;
  const x = findSel(); if (!x) return;
  if (b.dataset.c) { checkpoint(); x.color = b.dataset.c; insp.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s === b)); const ci = $('#f-color'); if (ci) ci.value = x.color; save(); requestRender(); return; }
  if (b.dataset.kind && sel.type === 'item' && b.dataset.kind !== x.kind) {
    checkpoint(); x.kind = b.dataset.kind;
    if (x.kind === 'event') { x.end = null; x.band = false; } else x.end = x.start + Math.max(S.snap, snapV((S.view.e - S.view.s) * 0.08) || 1);
    buildInspector(true); save(); requestRender(); return;
  }
  switch (b.dataset.act) {
    case 'close': select(null); break;
    case 'learn': toggleLearned(x); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'focus': focusItem(x); break;
    case 'dup': { checkpoint(); const cp = { ...strip(x), id: uid(), title: x.title + ' (복제)', learned: false }; S.items.push(cp); select({ type: 'item', id: cp.id }, true); save(); break; }
    case 'del': deleteSelected(); break;
    case 'up': case 'down': { checkpoint(); const i = S.tracks.indexOf(x), j = i + (b.dataset.act === 'up' ? -1 : 1); [S.tracks[i], S.tracks[j]] = [S.tracks[j], S.tracks[i]]; buildInspector(); save(); requestRender(); break; }
    case 'add-p': addItem('period', x.id); break;
    case 'add-e': addItem('event', x.id); break;
    case 'tpath': openPath(x.id); break;
    case 'all-learn': case 'all-reset': { checkpoint(); const v = b.dataset.act === 'all-learn'; S.items.forEach(i => { if (i.trackId === x.id) i.learned = v; }); buildInspector(); save(); requestRender(); toast(v ? '이 분야를 모두 학습 완료로 표시했습니다' : '학습 표시를 초기화했습니다'); break; }
    case 'recolor': checkpoint(); S.items.forEach(ev => { if (ev.trackId === x.id) ev.color = x.color; }); save(); requestRender(); toast('색을 맞췄습니다'); break;
    case 'cdel':
      if (b.classList.contains('armed')) { clearTimeout(armT); deleteSelected(); }
      else { b.classList.add('armed'); b.textContent = '한 번 더 누르면 삭제'; armT = setTimeout(() => { b.classList.remove('armed'); b.textContent = '분야 삭제'; }, 3000); }
      break;
  }
});

/* ---------- 학습 경로 ---------- */
const pathM = $('#path'), pList = $('#p-list');
function openPath(tid) {
  $('#p-track').innerHTML = `<option value="">모든 분야</option>` + S.tracks.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  $('#p-track').value = tid || '';
  pathM.hidden = false; renderPath(); $('#p-q').focus();
}
function renderPath() {
  const tid = $('#p-track').value, st = $('#p-state').value, q = $('#p-q').value.trim().toLowerCase();
  const list = ordered().filter(i => (!tid || i.trackId === tid) && (st === 'all' || (st === 'todo' ? !i.learned : i.learned)) && matches(i, q));
  let dec = null; const h = [];
  list.forEach(i => {
    const d = Math.floor(i.start / 10) * 10;
    if (d !== dec) { dec = d; h.push(`<li class="dec">${d}년대</li>`); }
    const t = track(i.trackId);
    h.push(`<li class="${i.learned ? 'done' : ''}"><input type="checkbox" data-id="${i.id}" ${i.learned ? 'checked' : ''} aria-label="${esc(i.title)} 학습 완료"><span class="py">${i.kind === 'period' ? `${i.start}–` : i.start}</span><span class="pt"><button data-go="${i.id}">${esc(i.title)}</button><span class="tr"><i style="background:${t?.color}"></i>${esc(t?.name || '')}${i.kind === 'period' ? ' · ' + rangeOf(i) : ''}</span>${i.note ? `<span class="pn">${esc(i.note)}</span>` : ''}</span></li>`);
  });
  pList.innerHTML = h.length ? h.join('') : `<li style="display:block;color:var(--muted)">조건에 맞는 항목이 없습니다.</li>`;
  const tot = ordered().filter(i => !tid || i.trackId === tid), dn = tot.filter(i => i.learned).length;
  $('#p-desc').textContent = `${tid ? track(tid)?.name + ' · ' : ''}${tot.length}개 중 ${dn}개 학습 완료. 제목을 누르면 연표의 그 위치로 이동하고, 체크하면 학습 완료로 표시됩니다.`;
}
['p-track', 'p-state'].forEach(id => $('#' + id).addEventListener('change', renderPath));
$('#p-q').addEventListener('input', renderPath);
pList.addEventListener('change', e => { const it = item(e.target.dataset.id); if (!it) return; checkpoint(); it.learned = e.target.checked; save(); requestRender(); buildInspector(); renderPath(); });
pList.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; const it = item(b.dataset.go); pathM.hidden = true; select({ type: 'item', id: it.id }); focusItem(it); });
$('#open-path').onclick = () => openPath('');
$('#p-close').onclick = () => { pathM.hidden = true; };
pathM.addEventListener('click', e => { if (e.target === pathM) pathM.hidden = true; });

/* ---------- 카드 복습 ---------- */
const cardM = $('#cardm');
let card = null, revealed = false;
function maskText(s, title) {
  let out = esc(s);
  const parts = [title, ...title.split(/[·,()]|\s[-–]\s/)].map(p => p.trim()).filter(p => p.length >= 2).sort((a, b) => b.length - a.length);
  parts.forEach(p => { out = out.split(esc(p)).join('<span class="mask">' + '■'.repeat(Math.min(6, p.length)) + '</span>'); });
  return out;
}
function nextCard() {
  const pool = S.items.filter(i => !i.learned && i.note);
  const src = pool.length ? pool : S.items.filter(i => i.note);
  if (!src.length) { card = null; renderCard(); return; }
  let c; do { c = src[Math.floor(Math.random() * src.length)]; } while (src.length > 1 && card && c.id === card.id);
  card = c; revealed = false; renderCard();
}
function renderCard() {
  const box = $('#c-card'), acts = $('#c-acts');
  const left = S.items.filter(i => !i.learned).length;
  $('#c-desc').textContent = left ? `설명과 인물을 보고 무엇인지 떠올려 보세요. 남은 미학습 항목 ${left}개.` : '모든 항목을 학습했습니다. 이제 전체에서 무작위로 복습합니다.';
  if (!card) { box.innerHTML = '<p class="q">설명이 있는 항목이 없습니다. 항목에 설명을 적으면 카드로 복습할 수 있습니다.</p>'; acts.innerHTML = ''; return; }
  const t = track(card.trackId);
  box.innerHTML = `<div class="ctop"><span class="tr"><i style="background:${t?.color}"></i>${esc(t?.name || '')}</span><span>${card.kind === 'period' ? '기간' : '개념·사건'}</span><span class="cy">${rangeOf(card)}</span></div>
    ${revealed ? `<p class="ans">${esc(card.title)}</p>` : '<p class="ans" style="color:var(--muted)">무엇일까요?</p>'}
    <p class="q">${revealed ? esc(card.note) : maskText(card.note, card.title)}</p>
    ${card.who ? `<span class="who">인물·기관: ${revealed ? esc(card.who) : maskText(card.who, card.title)}</span>` : ''}
    ${revealed && tagList(card.tags).length ? `<div class="tags">${tagList(card.tags).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>` : ''}`;
  acts.innerHTML = revealed
    ? `<button class="btn ok" data-c="know">알고 있었음 · 학습 완료</button><button class="btn" data-c="again">다시 볼게요</button><span class="sp"></span><button class="btn" data-c="go">연표에서 보기</button>`
    : `<button class="btn pri" data-c="reveal">정답 보기</button><button class="btn" data-c="skip">건너뛰기</button>`;
}
$('#c-acts').addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if (!b || !card) return;
  const a = b.dataset.c;
  if (a === 'reveal') { revealed = true; renderCard(); $('#c-acts .btn')?.focus(); }
  else if (a === 'skip' || a === 'again') nextCard();
  else if (a === 'know') { const it = item(card.id); if (it && !it.learned) { checkpoint(); it.learned = true; save(); requestRender(); } nextCard(); }
  else if (a === 'go') { const it = item(card.id); cardM.hidden = true; if (it) { select({ type: 'item', id: it.id }); focusItem(it); } }
});
$('#open-card').onclick = () => { cardM.hidden = false; nextCard(); $('#c-acts .btn')?.focus(); };
$('#c-close').onclick = () => { cardM.hidden = true; };
cardM.addEventListener('click', e => { if (e.target === cardM) cardM.hidden = true; });

/* ---------- 상단 도구 ---------- */
$('#title').value = S.title;
$('#title').addEventListener('focus', () => { editCk = false; });
$('#title').addEventListener('input', e => { if (!editCk) { checkpoint(); editCk = true; } S.title = e.target.value; save(); });
$('#snap').value = String(S.snap);
$('#snap').addEventListener('change', e => { S.snap = +e.target.value; save(); });
let hitIdx = -1;
$('#q').addEventListener('input', e => { S.q = e.target.value; hitIdx = -1; requestRender(); });
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const q = S.q.trim().toLowerCase(); if (!q) return;
  const hits = ordered().filter(it => matches(it, q));
  if (!hits.length) { toast('일치하는 항목이 없습니다'); return; }
  hitIdx = (hitIdx + 1) % hits.length;
  const it = hits[hitIdx]; select({ type: 'item', id: it.id }); focusItem(it);
  toast(`${hitIdx + 1} / ${hits.length} · ${it.title}`);
});
function armButton(btn, label, run) {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('warn')) { clearTimeout(btn._t); btn.classList.remove('warn'); btn.textContent = label; run(); return; }
    btn.classList.add('warn'); btn.textContent = '한 번 더 클릭';
    btn._t = setTimeout(() => { btn.classList.remove('warn'); btn.textContent = label; }, 3000);
  });
}
armButton($('#reset'), '예시', () => { checkpoint(); const d = sample(); S.title = d.title; S.tracks = d.tracks; S.items = d.items; S.view = d.view; $('#title').value = S.title; select(null); save(); toast('예시 연표를 불러왔습니다 · Ctrl+Z로 되돌리기'); });
armButton($('#clear'), '비우기', () => { checkpoint(); S.items = []; S.tracks = [{ id: uid(), name: '새 분야 1', color: PALETTE[0] }]; select(null); save(); toast('비웠습니다 · Ctrl+Z로 되돌리기'); });

/* ---------- 내보내기 / 가져오기 ---------- */
const modal = $('#modal'), mText = $('#m-text');
function openModal(mode) {
  modal.hidden = false;
  const isEx = mode === 'export';
  $('#m-title').textContent = isEx ? '연표 내보내기' : '연표 가져오기';
  $('#m-desc').textContent = isEx ? '아래 JSON을 복사해 보관하세요. 학습 완료 표시까지 함께 저장됩니다. 가져오기에 붙여넣으면 그대로 복원됩니다.' : 'JSON을 붙여넣거나 .json 파일을 고른 뒤 적용을 누르세요. 현재 연표를 대체합니다(Ctrl+Z로 되돌릴 수 있음).';
  mText.readOnly = isEx;
  mText.value = isEx ? JSON.stringify({ title: S.title, tracks: S.tracks, items: S.items.map(strip) }, null, 2) : '';
  $('#m-copy').hidden = !isEx; $('#m-apply').hidden = isEx; $('#m-file').hidden = isEx;
  (isEx ? $('#m-copy') : mText).focus();
}
$('#export').onclick = () => openModal('export');
$('#import').onclick = () => openModal('import');
$('#m-close').onclick = () => { modal.hidden = true; };
modal.addEventListener('click', e => { if (e.target === modal) modal.hidden = true; });
$('#m-copy').onclick = () => {
  const fallback = () => { mText.select(); toast('텍스트를 선택했습니다. Ctrl+C로 복사하세요'); };
  try { const p = navigator.clipboard?.writeText(mText.value); if (p) p.then(() => toast('복사했습니다'), fallback); else fallback(); } catch (e) { fallback(); }
};
$('#m-file').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { mText.value = r.result; }; r.readAsText(f); });
$('#m-apply').onclick = () => {
  try {
    const d = sanitize(JSON.parse(mText.value));
    checkpoint(); S.title = d.title; S.tracks = d.tracks; S.items = d.items;
    $('#title').value = S.title; modal.hidden = true; select(null); fit();
    toast(`분야 ${d.tracks.length}개, 항목 ${d.items.length}개를 불러왔습니다`);
  } catch (err) { toast('불러오지 못했습니다: ' + (err.message || 'JSON 형식을 확인하세요')); }
};

/* ---------- 키보드 ---------- */
document.addEventListener('keydown', e => {
  const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName) && t.type !== 'checkbox' && t.type !== 'range';
  const anyModal = !modal.hidden || !pathM.hidden || !cardM.hidden;
  if (e.key === 'Escape') { if (anyModal) { modal.hidden = pathM.hidden = cardM.hidden = true; } else select(null); return; }
  if (anyModal || typing) return;
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'BracketRight') { e.preventDefault(); step(1); return; }
  if (e.code === 'BracketLeft') { e.preventDefault(); step(-1); return; }
  if (e.code === 'KeyL' && sel && sel.type === 'item') { e.preventDefault(); toggleLearned(item(sel.id)); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel && sel.type === 'item') { e.preventDefault(); deleteSelected(); return; }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && sel && sel.type === 'item') {
    e.preventDefault(); const it = item(sel.id); if (!it) return;
    const d = (e.key === 'ArrowLeft' ? -1 : 1) * S.snap * (e.shiftKey ? 10 : 1);
    checkpoint(); it.start += d; if (it.end != null) it.end += d; refreshInspectorValues(); save(); requestRender();
  }
});

/* ---------- 알림 ---------- */
let toastT = 0;
function toast(m) { const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2200); }

/* ---------- 시작 ---------- */
new ResizeObserver(() => requestRender()).observe(board);
new ResizeObserver(() => requestRender()).observe(nav);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { tw.clear(); requestRender(); });
syncUndo();
render();
if (migrated) { save(); setTimeout(() => toast(`새 항목 ${migrated}개를 추가했습니다 · 학습 기록은 그대로입니다`), 400); }
})();
</script>

</body></html>
