<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>역사 연표 작업대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 간트 차트식 작업대 — 왼쪽 나라 열, 오른쪽 가상 시간축, 하단 전체 연표 내비게이터 */
:root{
  --bg:#e9eeec;
  --surface:#f7f9f8;
  --sunk:#eef2f1;
  --ink:#1b2a2f;
  --muted:#5b6b6f;
  --line:#cdd7d4;
  --grid:rgba(27,42,47,.07);
  --accent:#1d5c70;
  --accent-ink:#ffffff;
  --now:#b8452f;
  --danger:#a83a2c;
  --shadow:0 10px 30px rgba(20,35,40,.14);
  --f-display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --lw:150px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162124; --sunk:#1b282b; --ink:#e2ebe8; --muted:#8fa2a3; --line:#2a3a3e;
  --grid:rgba(226,235,232,.06); --accent:#72b5ca; --accent-ink:#0f1719; --now:#e07a5f; --danger:#e07a5f;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162124; --sunk:#1b282b; --ink:#e2ebe8; --muted:#8fa2a3; --line:#2a3a3e;
  --grid:rgba(226,235,232,.06); --accent:#72b5ca; --accent-ink:#0f1719; --now:#e07a5f; --danger:#e07a5f;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:19px;border-radius:6px}
#title{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);font-weight:700;padding:2px 4px;border-radius:6px}
#title:hover{background:var(--sunk)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.grp>button{border:0;background:transparent;padding:7px 11px;white-space:nowrap;font-size:13px;font-weight:500}
.grp>button+button{border-left:1px solid var(--line)}
.grp>button:hover{background:var(--sunk)}
.grp>button.pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.grp>button.pri:hover{filter:brightness(1.08)}
.grp>button:disabled{opacity:.35;cursor:default}
.grp>button.warn{color:var(--danger);font-weight:600}
.zoomgrp{padding-right:4px}
#zoom{width:110px;accent-color:var(--accent);margin:0 6px}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 4px 0 10px}
.field select{border:0;background:transparent;padding:7px 4px;font-size:13px;color:var(--ink)}
#q{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 10px;width:150px;font-size:13px}

/* board */
.board{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);overscroll-behavior:contain}
.ruler{position:sticky;top:0;z-index:8;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.corner{width:var(--lw);flex:none;box-sizing:border-box;border-right:1px solid var(--line);padding:0 12px;display:flex;align-items:center;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.rtrack{position:relative;flex:1;min-width:0;height:42px;overflow:hidden}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.tick span{position:absolute;top:13px;left:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick.bc span{color:var(--ink)}
.nowtag{position:absolute;bottom:3px;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;background:var(--now);color:#fff;padding:1px 5px;border-radius:3px}
.row{display:flex;border-bottom:1px solid var(--line);position:relative}
.row.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.row.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.label{width:var(--lw);flex:none;box-sizing:border-box;border-right:1px solid var(--line);padding:10px 10px 10px 6px;display:flex;gap:7px;align-items:flex-start;cursor:pointer;background:var(--surface);user-select:none}
.label:hover{background:var(--sunk)}
.row.csel .label{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.grip{flex:none;width:10px;height:22px;cursor:grab;touch-action:none;background-image:radial-gradient(circle,var(--muted) 1.2px,transparent 1.4px);background-size:5px 5px;opacity:.55}
.grip:hover{opacity:1}
.chip{flex:none;width:10px;height:10px;border-radius:2px;margin-top:5px}
.ln{display:flex;flex-direction:column;gap:2px;min-width:0}
.ln b{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln small{font-size:11px;color:var(--muted)}
.track{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:pan-y;cursor:grab}
.board.panning .track{cursor:grabbing}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid);pointer-events:none}
.gl.zero{background:var(--line)}
.nowline{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--now);opacity:.6;pointer-events:none;z-index:1}

.bar{position:absolute;height:26px;box-sizing:border-box;border-radius:5px;background:var(--c);display:flex;align-items:center;gap:7px;padding:0 10px;cursor:grab;touch-action:none;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:600;z-index:3;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);user-select:none}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.bar:hover{z-index:5;filter:brightness(1.06)}
.bar .bt{overflow:hidden;text-overflow:ellipsis}
.bar .by{font-family:var(--f-mono);font-size:10.5px;font-weight:500;opacity:.78;font-variant-numeric:tabular-nums}
.bar .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:1}
.bar .h.l{left:0}.bar .h.r{right:0}
.bar .h::after{content:"";position:absolute;top:7px;bottom:7px;left:3px;width:3px;border-left:1px solid currentColor;border-right:1px solid currentColor;opacity:0}
.bar:hover .h::after,.bar.sel .h::after{opacity:.6}
.sel{outline:2px solid var(--ink);outline-offset:2px;z-index:6!important}
.dim{opacity:.18}
.hit{box-shadow:0 0 0 3px var(--accent)}

.evt{position:absolute;height:20px;display:flex;align-items:center;gap:5px;cursor:grab;touch-action:none;white-space:nowrap;font-size:12px;z-index:2;user-select:none}
.evt::after{content:"";position:absolute;left:4.5px;top:15px;height:var(--stem);border-left:1.5px dashed var(--c);opacity:.5;pointer-events:none}
.evt .dot{flex:none;width:10px;height:10px;box-sizing:border-box;transform:rotate(45deg);background:var(--c);border:1.5px solid var(--surface);box-shadow:0 0 0 1px var(--c)}
.evt .et{font-weight:600;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:4px}
.evt .ey{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.evt:hover{z-index:5}
.evt:hover .et{border-color:var(--c)}
.evt.sel{outline-offset:3px;border-radius:4px}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* footer + navigator */
.foot{display:flex;flex-direction:column;gap:6px}
.nav{position:relative;height:62px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;touch-action:none;cursor:pointer;user-select:none}
.ntk{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.ntk span{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:9.5px;color:var(--muted);white-space:nowrap}
.np{position:absolute;height:3px;border-radius:2px;opacity:.85}
.ne{position:absolute;width:2px;height:7px}
.shade{position:absolute;top:0;bottom:0;background:var(--bg);opacity:.55;pointer-events:none}
.brush{position:absolute;top:0;bottom:0;box-sizing:border-box;border:2px solid var(--accent);border-radius:8px;cursor:grab;background:transparent}
.brush:active{cursor:grabbing}
.bh{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize}
.bh.l{left:-7px}.bh.r{right:-7px}
.bh::after{content:"";position:absolute;left:4px;top:50%;width:6px;height:22px;margin-top:-11px;border-radius:3px;background:var(--accent)}
.hint{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.hint kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--surface)}

/* inspector */
#insp{position:fixed;right:24px;top:132px;width:320px;max-height:calc(100% - 160px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30}
.ih{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.ih h2{margin:0;font-family:var(--f-display);font-size:17px}
.ih .kind{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:block;font-family:var(--f-body);font-weight:500;margin-bottom:1px}
.x{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--sunk)}
.ib{padding:14px;display:flex;flex-direction:column;gap:12px}
.ib label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.ib input[type=text],.ib input[type=number],.ib select,.ib textarea{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:7px 9px;font-size:14px;color:var(--ink);min-width:0}
.ib textarea{resize:vertical;min-height:64px;line-height:1.5}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.yr{display:grid;grid-template-columns:44px 1fr 74px;gap:6px;align-items:center}
.yr span{font-size:12px;color:var(--muted);font-weight:500}
.yr input{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dur{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-left:50px}
.sws{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sw{aspect-ratio:1;max-width:100%;border-radius:6px;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.swc{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px dashed var(--muted);display:grid;place-items:center;font-size:15px;color:var(--muted)}
.swc input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.small{font-size:12px;color:var(--muted);margin:0;line-height:1.5}

/* tooltip */
#tip{position:fixed;z-index:40;pointer-events:none;max-width:260px;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:var(--shadow)}
#tip b{display:block;font-size:13px}
#tip .m{font-family:var(--f-mono);font-size:11px;opacity:.8}
#tip .n{margin-top:4px;opacity:.85}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,24,.45);display:grid;place-items:center;padding:16px}
.dlg{width:min(640px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:var(--surface);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.dlg h2{margin:0;font-family:var(--f-display);font-size:19px}
.dlg p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.dlg textarea{min-height:260px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;resize:vertical;color:var(--ink)}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mrow .sp{flex:1}
#m-file{font-size:12px;max-width:100%}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow)}

@media (max-width:760px){
  :root{--lw:96px}
  .app{padding-block:8px;gap:8px}
  .ln small{display:none}
  .grip{display:none}
  .label{padding-left:10px}
  #q{width:100%;order:9}
  #zoom{width:70px}
  .hint{display:none}
  #insp{left:0;right:0;top:auto;bottom:0;width:auto;max-height:62%;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">年</span>
      <input id="title" type="text" aria-label="차트 제목" spellcheck="false">
    </div>
    <div class="tools">
      <div class="grp">
        <button id="add-period" class="pri" title="보이는 구간 가운데에 기간 추가">+ 기간</button>
        <button id="add-event" title="보이는 구간 가운데에 사건 추가">+ 사건</button>
        <button id="add-country">+ 나라</button>
      </div>
      <div class="grp">
        <button id="undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">↶</button>
        <button id="redo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행">↷</button>
      </div>
      <div class="grp zoomgrp">
        <button id="zoom-out" title="축소" aria-label="축소">−</button>
        <input id="zoom" type="range" min="0" max="1000" aria-label="확대 정도">
        <button id="zoom-in" title="확대" aria-label="확대">+</button>
        <button id="fit" title="모든 항목이 보이도록 맞춤">전체 보기</button>
      </div>
      <label class="field">스냅
        <select id="snap">
          <option value="1">1년</option><option value="5">5년</option><option value="10">10년</option>
          <option value="25">25년</option><option value="50">50년</option><option value="100">100년</option>
        </select>
      </label>
      <input id="q" type="search" placeholder="사건 검색 후 Enter" aria-label="사건 검색">
      <div class="grp">
        <button id="export">내보내기</button>
        <button id="import">가져오기</button>
        <button id="reset" title="예시 연표로 되돌립니다">예시</button>
        <button id="clear">비우기</button>
      </div>
    </div>
  </header>

  <main class="board" id="board">
    <div class="ruler"><div class="corner">나라 · 연도</div><div class="rtrack" id="rtrack"></div></div>
    <div id="rows"></div>
  </main>

  <footer class="foot">
    <div class="nav" id="nav" title="창을 끌어 이동하고 양 끝을 끌어 보는 구간을 늘이거나 줄입니다"></div>
    <p class="hint">빈 곳 <kbd>더블클릭</kbd> 기간 추가 · 막대 끌기: 연도 이동, 위아래로 다른 나라로 · 막대 양 끝 끌기: 기간 늘이기 · 배경 끌기 또는 <kbd>Shift</kbd>+휠: 시간 이동 · <kbd>Ctrl</kbd>+휠: 확대/축소 · <kbd>←</kbd><kbd>→</kbd> 선택 항목 이동 · <kbd>Del</kbd> 삭제 · 예시 연대는 통설 기준이며 학설에 따라 다를 수 있습니다.</p>
  </footer>
</div>

<aside id="insp" hidden></aside>
<div id="tip" hidden></div>
<div id="toast" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title"></h2>
    <p id="m-desc"></p>
    <textarea id="m-text" spellcheck="false"></textarea>
    <div class="mrow">
      <input id="m-file" type="file" accept=".json,application/json">
      <span class="sp"></span>
      <button class="btn" id="m-copy">복사</button>
      <button class="btn pri" id="m-apply">적용</button>
      <button class="btn" id="m-close">닫기</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const KEY = 'history-chart-builder-v1';
const PALETTE = ['#b5473a','#d08a2e','#c9a92e','#5f8f3e','#2f8f7a','#2f6f9f','#4d5fb0','#7a4fa3','#a64d7e','#7a6a58','#4a5a60','#26343a','#8c2f39'];
const NOW = new Date().getFullYear();
const PAD = 10, EVT_H = 24, LANE_H = 34, MIN_ROW = 60;
const MIN_SPAN = 10, MAX_SPAN = 20000;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let idc = 0;
const uid = () => Date.now().toString(36) + (idc++).toString(36) + Math.random().toString(36).slice(2, 6);
const hex = c => (typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c)) ? c.toLowerCase() : null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 예시 데이터 ---------- */
function sample() {
  const countries = [
    { id: 'kr', name: '한국', color: '#2f6f9f' },
    { id: 'cn', name: '중국', color: '#b5473a' },
    { id: 'jp', name: '일본', color: '#a64d7e' },
    { id: 'eu', name: '유럽', color: '#5f8f3e' },
    { id: 'w',  name: '세계사', color: '#7a6a58' },
  ];

  const events = d.events.filter(e => e && ids.has(String(e.countryId)) && Number.isFinite(+e.start)).map(e => {

    let s = Math.round(+e.start), en = kind === 'period' ? Math.round(Number.isFinite(+e.end) && e.end !== null ? +e.end : s + 1) : null;

    return { id: String(e.id ?? uid()), countryId: String(e.countryId), kind, title: String(e.title || '제목 없음'), start: s, end: en, color: hex(e.color) || '#2f6f9f', note: String(e.note || '') };

    const it = item(el.dataset.id); if (!it) return;
    const h = e.target.closest('.h');
    d = { ...d, mode: h ? (h.classList.contains('l') ? 'rl' : 'rr') : 'move', it, o: { start: it.start, end: it.end, countryId: it.countryId } };
  } else if (track) d = { ...d, mode: 'pan', o: { ...S.view } };
  else return;
  if (e.pointerType === 'mouse' || d.mode !== 'pan') e.preventDefault();
  drag = d;
  addEventListener('pointermove', onMove); addEventListener('pointerup', onUp); addEventListener('pointercancel', onCancel);
});
function onMove(e) {
  const d = drag; if (!d) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.moved) {
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    d.moved = true;
    if (['move', 'rl', 'rr'].includes(d.mode)) { checkpoint(); select({ type: 'item', id: d.it.id }); }
    if (d.mode === 'pan') board.classList.add('panning');
  }
  const dyr = dx / d.W * d.span;
  if (d.mode === 'pan') { S.view = { s: d.o.s - dyr, e: d.o.e - dyr }; requestRender(); return; }
  if (d.mode === 'reorder') {
    document.querySelectorAll('.row.drop-before,.row.drop-after').forEach(r => r.classList.remove('drop-before', 'drop-after'));
    const r = rowAt(e.clientY); if (r) r.el.classList.add(r.after ? 'drop-after' : 'drop-before'); d.target = r; return;
  }
  if (d.mode === 'label') return;
  const it = d.it, o = d.o;
  if (d.mode === 'move') {
    it.start = snapV(o.start + dyr);
    if (it.kind === 'period') it.end = it.start + (o.end - o.start);
    const rowEl = document.elementFromPoint(e.clientX, e.clientY)?.closest('.row');
    if (rowEl && rowEl.dataset.cid) it.countryId = rowEl.dataset.cid;
  } else if (d.mode === 'rl') it.start = Math.min(snapV(o.start + dyr), it.end - 1);
  else if (d.mode === 'rr') it.end = Math.max(snapV(o.end + dyr), it.start + 1);
  showTip(it, e.clientX, e.clientY);
  refreshInspectorValues();
  requestRender();
}
function rowAt(y) {
  const rows = [...rowsEl.querySelectorAll('.row')];
  for (const r of rows) { const b = r.getBoundingClientRect(); if (y >= b.top && y <= b.bottom) return { el: r, cid: r.dataset.cid, after: y > b.top + b.height / 2 }; }
  if (rows.length) { const last = rows[rows.length - 1]; if (y > last.getBoundingClientRect().bottom) return { el: last, cid: last.dataset.cid, after: true }; }
  return null;
}
function endDrag() { removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); removeEventListener('pointercancel', onCancel); board.classList.remove('panning'); }
function onCancel() { endDrag(); drag = null; tip.hidden = true; requestRender(); }
function onUp(e) {
  const d = drag; endDrag(); drag = null;
  if (!d) return;
  if (!d.moved) {
    if (d.mode === 'label' || d.mode === 'reorder') select({ type: 'country', id: d.cid });
    else if (d.it) select({ type: 'item', id: d.it.id });
    else if (d.mode === 'pan') select(null);
    return;
  }
  tip.hidden = true;
  if (d.mode === 'reorder' && d.target && d.target.cid !== d.cid) {
    checkpoint();
    const from = S.countries.findIndex(c => c.id === d.cid); const [c] = S.countries.splice(from, 1);
    let to = S.countries.findIndex(x => x.id === d.target.cid); if (d.target.after) to++;
    S.countries.splice(to, 0, c);
  }
  if (d.it) buildInspector();
  save(); requestRender();
}
board.addEventListener('dblclick', e => {
  const el = e.target.closest('.bar,.evt');
  if (el) { select({ type: 'item', id: el.dataset.id }); const t = $('#f-title'); if (t) { t.focus(); t.select(); } return; }
  const track = e.target.closest('.track'); if (!track) return;
  const yr = Yr(e.clientX - track.getBoundingClientRect().left);
  addItem('period', track.closest('.row').dataset.cid, yr);
});

/* ---------- 추가 / 삭제 ---------- */
function currentCountryId() {
  if (sel) { const x = findSel(); if (x) return sel.type === 'country' ? x.id : x.countryId; }
  return S.countries[0]?.id;
}
function addItem(kind, cid, at) {
  cid = cid || currentCountryId();
  if (!cid) { toast('먼저 나라를 추가하세요'); return; }
  checkpoint();
  const sp = S.view.e - S.view.s, c = at ?? (S.view.s + S.view.e) / 2;
  const len = Math.max(S.snap, snapV(sp * 0.1)) || 1;
  const start = kind === 'period' ? snapV(c - len / 2) : snapV(c);
  const it = { id: uid(), countryId: cid, kind, title: kind === 'period' ? '새 기간' : '새 사건', start, end: kind === 'period' ? start + len : null, color: country(cid)?.color || PALETTE[5], note: '' };
  S.events.push(it); select({ type: 'item', id: it.id }); save();
  const t = $('#f-title'); if (t) { t.focus(); t.select(); }
}
function addCountry() {
  checkpoint();
  const c = { id: uid(), name: `새 나라 ${S.countries.length + 1}`, color: PALETTE[S.countries.length % PALETTE.length] };
  S.countries.push(c); select({ type: 'country', id: c.id }); save();
  const n = $('#c-name'); if (n) { n.focus(); n.select(); }
  requestAnimationFrame(() => { board.scrollTop = board.scrollHeight; });
}
function deleteSelected() {
  if (!sel) return;
  if (sel.type === 'item') { checkpoint(); S.events = S.events.filter(e => e.id !== sel.id); toast('삭제했습니다 · Ctrl+Z로 되돌리기'); }
  else { checkpoint(); const id = sel.id; S.countries = S.countries.filter(c => c.id !== id); S.events = S.events.filter(e => e.countryId !== id); toast('나라와 항목을 삭제했습니다 · Ctrl+Z로 되돌리기'); }
  select(null); save();
}
$('#add-period').onclick = () => addItem('period');
$('#add-event').onclick = () => addItem('event');
$('#add-country').onclick = addCountry;
$('#undo').onclick = undo; $('#redo').onclick = redo;

/* ---------- 인스펙터 ---------- */
const insp = $('#insp');
let editCk = false;
function select(s) { sel = s; buildInspector(); requestRender(); }
function yearField(key, label, v) {
  return `<div class="yr"><span>${label}</span><input id="f-${key}" type="number" min="1" step="1" value="${Math.abs(v) || 1}" inputmode="numeric"><select id="f-${key}-era" aria-label="${label} 기원"><option value="AD"${v >= 0 ? ' selected' : ''}>AD 서기</option><option value="BC"${v < 0 ? ' selected' : ''}>BC 기원전</option></select></div>`;
}
function swatches(cur) {
  return `<div class="sws">${PALETTE.map(c => `<button class="sw${c === cur ? ' on' : ''}" data-c="${c}" style="--c:${c}" aria-label="색상 ${c}"></button>`).join('')}<label class="swc" title="직접 고르기">＋<input type="color" id="f-color" value="${cur}"></label></div>`;
}
function buildInspector() {
  const x = findSel();
  if (!x) { insp.hidden = true; insp.innerHTML = ''; return; }
  editCk = false;
  if (sel.type === 'item') {
    const it = x;
    insp.innerHTML = `<div class="ih"><h2><span class="kind">${it.kind === 'period' ? '기간' : '사건'} 편집</span>${esc(it.title)}</h2><button class="x" data-act="close" aria-label="닫기">×</button></div>
    <div class="ib">
      <label class="f">제목<input id="f-title" type="text" value="${esc(it.title)}"></label>
      <div class="seg" role="group" aria-label="종류"><button data-kind="period" class="${it.kind === 'period' ? 'on' : ''}">기간 (시작–끝)</button><button data-kind="event" class="${it.kind === 'event' ? 'on' : ''}">사건 (한 해)</button></div>
      <label class="f">나라<select id="f-country">${S.countries.map(c => `<option value="${c.id}"${c.id === it.countryId ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      ${yearField('start', it.kind === 'period' ? '시작' : '연도', it.start)}
      ${it.kind === 'period' ? yearField('end', '끝', it.end) + `<div class="dur" id="f-dur">${durOf(it)}</div>` : ''}
      <div class="f"><span class="small">색상</span>${swatches(it.color)}</div>
      <label class="f">메모<textarea id="f-note" placeholder="출처, 설명 등">${esc(it.note)}</textarea></label>
      <div class="acts"><button class="btn" data-act="focus">이 항목으로 이동</button><button class="btn" data-act="dup">복제</button><button class="btn danger" data-act="del">삭제</button></div>
    </div>`;
  } else {
    const c = x, n = S.events.filter(e => e.countryId === c.id).length, i = S.countries.indexOf(c);
    insp.innerHTML = `<div class="ih"><h2><span class="kind">나라 편집</span>${esc(c.name)}</h2><button class="x" data-act="close" aria-label="닫기">×</button></div>
    <div class="ib">
      <label class="f">이름<input id="c-name" type="text" value="${esc(c.name)}"></label>
      <div class="f"><span class="small">대표 색상 · 새 항목의 기본 색</span>${swatches(c.color)}</div>
      <div class="acts"><button class="btn" data-act="up"${i === 0 ? ' disabled' : ''}>↑ 위로</button><button class="btn" data-act="down"${i === S.countries.length - 1 ? ' disabled' : ''}>↓ 아래로</button></div>
      <div class="acts"><button class="btn pri" data-act="add-p">+ 이 나라에 기간</button><button class="btn" data-act="add-e">+ 사건</button></div>
      <p class="small">항목 ${n}개. 나라를 삭제하면 그 안의 항목도 함께 지워집니다.</p>
      <div class="acts"><button class="btn danger" data-act="cdel">나라 삭제</button><button class="btn" data-act="recolor">모든 항목을 대표 색으로</button></div>
    </div>`;
  }
  insp.hidden = false;
}
function refreshInspectorValues() {
  if (!sel || sel.type !== 'item') return; const it = item(sel.id); if (!it) return;
  const set = (id, v) => { const el = $('#' + id); if (el && document.activeElement !== el) el.value = v; };
  set('f-start', Math.abs(it.start) || 1); set('f-start-era', it.start < 0 ? 'BC' : 'AD');
  if (it.kind === 'period') { set('f-end', Math.abs(it.end) || 1); set('f-end-era', it.end < 0 ? 'BC' : 'AD'); const d = $('#f-dur'); if (d) d.textContent = durOf(it); }
  const cs = $('#f-country'); if (cs) cs.value = it.countryId;
}
const readYear = key => { const n = Math.max(1, Math.round(Math.abs(+$('#f-' + key).value || 1))); return $('#f-' + key + '-era').value === 'BC' ? -n : n; };
insp.addEventListener('focusin', () => { editCk = false; });
function onField(e) {
  const id = e.target.id; if (!id || !sel) return;
  const x = findSel(); if (!x) return;
  if (!editCk) { checkpoint(); editCk = true; }
  if (sel.type === 'item') {
    const it = x;
    if (id === 'f-title') { it.title = e.target.value; const h = insp.querySelector('.ih h2'); if (h) h.lastChild.textContent = it.title; }
    else if (id === 'f-country') it.countryId = e.target.value;
    else if (id.startsWith('f-start')) { it.start = readYear('start'); if (it.kind === 'period' && e.type === 'change' && it.end <= it.start) { it.end = it.start + 1; refreshInspectorValues(); } }
    else if (id.startsWith('f-end')) { it.end = readYear('end'); if (e.type === 'change' && it.end <= it.start) { const s = it.start; it.start = Math.min(s, it.end); it.end = Math.max(s, it.end); if (it.end === it.start) it.end++; refreshInspectorValues(); } }
    else if (id === 'f-color') { it.color = e.target.value; insp.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === it.color)); }
    else if (id === 'f-note') it.note = e.target.value;
    const d = $('#f-dur'); if (d) d.textContent = durOf(it);
  } else {
    if (id === 'c-name') { x.name = e.target.value; const h = insp.querySelector('.ih h2'); if (h) h.lastChild.textContent = x.name; }
    else if (id === 'f-color') { x.color = e.target.value; insp.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === x.color)); }
  }
  save(); requestRender();
}
insp.addEventListener('input', onField);
insp.addEventListener('change', onField);
let armT = 0;
insp.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !sel) return;
  const x = findSel(); if (!x) return;
  if (b.dataset.c) { checkpoint(); x.color = b.dataset.c; insp.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s === b)); const ci = $('#f-color'); if (ci) ci.value = x.color; save(); requestRender(); return; }
  if (b.dataset.kind && sel.type === 'item' && b.dataset.kind !== x.kind) {
    checkpoint(); x.kind = b.dataset.kind;
    if (x.kind === 'event') x.end = null; else x.end = x.start + Math.max(S.snap, snapV((S.view.e - S.view.s) * 0.08) || 1);
    buildInspector(); save(); requestRender(); return;
  }
  switch (b.dataset.act) {
    case 'close': select(null); break;
    case 'focus': focusItem(x); break;
    case 'dup': { checkpoint(); const cp = { ...x, id: uid(), title: x.title + ' (복제)' }; delete cp._lane; S.events.push(cp); select({ type: 'item', id: cp.id }); save(); break; }
    case 'del': deleteSelected(); break;
    case 'up': case 'down': { checkpoint(); const i = S.countries.indexOf(x), j = i + (b.dataset.act === 'up' ? -1 : 1); [S.countries[i], S.countries[j]] = [S.countries[j], S.countries[i]]; buildInspector(); save(); requestRender(); break; }
    case 'add-p': addItem('period', x.id); break;
    case 'add-e': addItem('event', x.id); break;
    case 'recolor': checkpoint(); S.events.forEach(ev => { if (ev.countryId === x.id) ev.color = x.color; }); save(); requestRender(); toast('색을 맞췄습니다'); break;
    case 'cdel':
      if (b.classList.contains('armed')) { clearTimeout(armT); deleteSelected(); }
      else { b.classList.add('armed'); b.textContent = '한 번 더 누르면 삭제'; armT = setTimeout(() => { b.classList.remove('armed'); b.textContent = '나라 삭제'; }, 3000); }
      break;
  }
});

/* ---------- 상단 도구 ---------- */
$('#title').value = S.title;
$('#title').addEventListener('focus', () => { editCk = false; });
$('#title').addEventListener('input', e => { if (!editCk) { checkpoint(); editCk = true; } S.title = e.target.value; save(); });
$('#snap').value = String(S.snap);
$('#snap').addEventListener('change', e => { S.snap = +e.target.value; save(); });
let hitIdx = -1;
$('#q').addEventListener('input', e => { S.q = e.target.value; hitIdx = -1; requestRender(); });
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = S.q.trim().toLowerCase(); if (!q) return;
  const hits = S.events.filter(it => matches(it, q)).sort((a, b) => a.start - b.start);
  if (!hits.length) { toast('일치하는 항목이 없습니다'); return; }
  hitIdx = (hitIdx + 1) % hits.length;
  const it = hits[hitIdx]; focusItem(it); select({ type: 'item', id: it.id });
  toast(`${hitIdx + 1} / ${hits.length} · ${it.title}`);
});
function armButton(btn, label, run) {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('warn')) { clearTimeout(btn._t); btn.classList.remove('warn'); btn.textContent = label; run(); return; }
    btn.classList.add('warn'); btn.textContent = '한 번 더 클릭';
    btn._t = setTimeout(() => { btn.classList.remove('warn'); btn.textContent = label; }, 3000);
  });
}
armButton($('#reset'), '예시', () => { checkpoint(); const d = sample(); S.title = d.title; S.countries = d.countries; S.events = d.events; S.view = d.view; $('#title').value = S.title; select(null); save(); toast('예시 연표를 불러왔습니다 · Ctrl+Z로 되돌리기'); });
armButton($('#clear'), '비우기', () => { checkpoint(); S.events = []; S.countries = [{ id: uid(), name: '새 나라 1', color: PALETTE[5] }]; select(null); save(); toast('비웠습니다 · Ctrl+Z로 되돌리기'); });

/* ---------- 내보내기 / 가져오기 ---------- */
const modal = $('#modal'), mText = $('#m-text');
let mMode = '';
function openModal(mode) {
  mMode = mode; modal.hidden = false;
  const isEx = mode === 'export';
  $('#m-title').textContent = isEx ? '연표 내보내기' : '연표 가져오기';
  $('#m-desc').textContent = isEx ? '아래 JSON을 복사해 보관하세요. 가져오기에 붙여넣으면 그대로 복원됩니다.' : 'JSON을 붙여넣거나 .json 파일을 고른 뒤 적용을 누르세요. 현재 연표를 대체합니다(Ctrl+Z로 되돌릴 수 있음).';
  mText.readOnly = isEx;
  mText.value = isEx ? JSON.stringify({ title: S.title, countries: S.countries, events: S.events.map(({ _lane, ...r }) => r) }, null, 2) : '';
  $('#m-copy').hidden = !isEx; $('#m-apply').hidden = isEx; $('#m-file').hidden = isEx;
  (isEx ? $('#m-copy') : mText).focus();
}
$('#export').onclick = () => openModal('export');
$('#import').onclick = () => openModal('import');
$('#m-close').onclick = () => { modal.hidden = true; };
modal.addEventListener('click', e => { if (e.target === modal) modal.hidden = true; });
$('#m-copy').onclick = () => {
  const p = navigator.clipboard?.writeText(mText.value);
  if (p) p.then(() => toast('복사했습니다'), () => { mText.select(); toast('텍스트를 선택했습니다. Ctrl+C로 복사하세요'); });
  else { mText.select(); toast('텍스트를 선택했습니다. Ctrl+C로 복사하세요'); }
};
$('#m-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { mText.value = r.result; }; r.readAsText(f);
});
$('#m-apply').onclick = () => {
  try {
    const d = sanitize(JSON.parse(mText.value));
    checkpoint(); S.title = d.title; S.countries = d.countries; S.events = d.events;
    $('#title').value = S.title; modal.hidden = true; select(null); fit();
    toast(`나라 ${d.countries.length}개, 항목 ${d.events.length}개를 불러왔습니다`);
  } catch (err) { toast('불러오지 못했습니다: ' + (err.message || 'JSON 형식을 확인하세요')); }
};

/* ---------- 키보드 ---------- */
document.addEventListener('keydown', e => {
  const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (e.key === 'Escape') { if (!modal.hidden) modal.hidden = true; else select(null); return; }
  if (typing) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel && sel.type === 'item') { e.preventDefault(); deleteSelected(); return; }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && sel && sel.type === 'item') {
    e.preventDefault(); const it = item(sel.id); if (!it) return;
    const d = (e.key === 'ArrowLeft' ? -1 : 1) * S.snap * (e.shiftKey ? 10 : 1);
    checkpoint(); it.start += d; if (it.end != null) it.end += d; refreshInspectorValues(); save(); requestRender();
  }
});

/* ---------- 알림 ---------- */
let toastT = 0;
function toast(m) { const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2200); }

/* ---------- 시작 ---------- */
new ResizeObserver(() => requestRender()).observe(board);
new ResizeObserver(() => requestRender()).observe(nav);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { tw.clear(); requestRender(); });
syncUndo();
render();
})();
</script>
